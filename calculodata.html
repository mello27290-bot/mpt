<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Chrono // Diferença de Dias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --panel-bg: rgba(13, 20, 36, 0.7);
      --cyan-neon: #00f0ff;
      --magenta-neon: #ff0077;
      --cyan-glow: rgba(0, 240, 255, 0.35);
      --magenta-glow: rgba(255, 0, 119, 0.35);
      --text-main: #e2e8f0;
      --text-dim: #64748b;
      --border-color: rgba(0, 240, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Grid de fundo futurista */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    /* Feixe de luz de fundo */
    body::after {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, rgba(255, 0, 119, 0.04) 50%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header .status-tag {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan-neon);
      margin-bottom: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-tag::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--cyan-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan-neon);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .header h1 {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 30%, var(--cyan-neon) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .btn-quick-today {
      background: none;
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--cyan-neon);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-quick-today:hover {
      background: var(--cyan-glow);
      border-color: var(--cyan-neon);
      color: #fff;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="date"] {
      width: 100%;
      background: rgba(10, 15, 28, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 8px;
      outline: none;
      transition: all 0.3s;
    }

    input[type="date"]:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 15px var(--cyan-glow);
      background: rgba(15, 23, 42, 0.95);
    }

    /* Ícone do calendário customizado para WebKit */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) hue-rotate(150deg) brightness(1.2);
      cursor: pointer;
    }

    /* Área de Resultado */
    .result-card {
      margin-top: 26px;
      background: rgba(4, 8, 18, 0.75);
      border: 1px solid rgba(255, 0, 119, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(255, 0, 119, 0.05);
    }

    .result-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--magenta-neon), transparent);
    }

    .result-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f472b6;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .counter-value {
      font-family: 'Orbitron', monospace;
      font-size: 3.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px var(--magenta-glow);
      line-height: 1;
      margin: 8px 0;
    }

    .result-unit {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .result-extra {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="status-tag">Temporal Calculator v2.6</div>
      <h1>Delta Chrono</h1>
    </div>

    <!-- Data Inicial -->
    <div class="input-group">
      <div class="label-row">
        <label for="startDate">Data Inicial / Base</label>
      </div>
      <div class="input-wrapper">
        <input type="date" id="startDate">
      </div>
    </div>

    <!-- Data Recente / Final -->
    <div class="input-group">
      <div class="label-row">
        <label for="endDate">Data Recente / Alvo</label>
        <button class="btn-quick-today" type="button" onclick="setToday()">Resetar p/ Hoje</button>
      </div>
      <div class="input-wrapper">
        <input type="date" id="endDate">
      </div>
    </div>

    <!-- Resultado -->
    <div class="result-card">
      <div class="result-title">Diferença Temporal</div>
      <div class="counter-value" id="daysCount">0</div>
      <div class="result-unit" id="unitLabel">DIAS</div>
      <div class="result-extra" id="extraInfo">Selecione a data inicial</div>
    </div>
  </div>

  <script>
    const startInput = document.getElementById('startDate');
    const endInput = document.getElementById('endDate');
    const daysCount = document.getElementById('daysCount');
    const unitLabel = document.getElementById('unitLabel');
    const extraInfo = document.getElementById('extraInfo');

    // Formata objeto Date para string YYYY-MM-DD local
    function formatDateToInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Define a data de hoje no campo final
    function setToday() {
      const today = new Date();
      endInput.value = formatDateToInput(today);
      calculateDifference();
    }

    // Realiza o cálculo da diferença
    function calculateDifference() {
      if (!startInput.value || !endInput.value) {
        daysCount.textContent = "--";
        extraInfo.textContent = "Defina ambas as datas para o cálculo";
        return;
      }

      // Converte considerando UTC puro para evitar problemas de fuso horário / horário de verão
      const [y1, m1, d1] = startInput.value.split('-').map(Number);
      const [y2, m2, d2] = endInput.value.split('-').map(Number);

      const utc1 = Date.UTC(y1, m1 - 1, d1);
      const utc2 = Date.UTC(y2, m2 - 1, d2);

      const diffMs = utc2 - utc1;
      const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
      const absDays = Math.abs(diffDays);

      daysCount.textContent = absDays;
      unitLabel.textContent = absDays === 1 ? "DIA" : "DIAS";

      if (diffDays === 0) {
        extraInfo.textContent = "Mesmo dia (0 dias de intervalo)";
      } else if (diffDays > 0) {
        extraInfo.textContent = `A data final está ${absDays} dia(s) à frente`;
      } else {
        extraInfo.textContent = `A data final está ${absDays} dia(s) no passado`;
      }
    }

    // Inicialização ao carregar
    window.addEventListener('DOMContentLoaded', () => {
      setToday();
      startInput.addEventListener('input', calculateDifference);
      endInput.addEventListener('input', calculateDifference);
    });
  </script>
</body>
</html>
